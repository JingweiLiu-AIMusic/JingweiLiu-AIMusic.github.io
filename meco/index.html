<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MeCo - Melody to Chords</title></head><body><div id="root"></div><script>// Stable entry point: resolve the current hashed assets without caching the manifest.
(async () => {
  try {
    const response = await fetch('./release.json?t=' + Date.now(), {cache: 'no-store'});
    if (!response.ok) throw new Error('Unable to load release');
    const release = await response.json();
    for (const href of release.css) {
      const link = document.createElement('link'); link.rel = 'stylesheet'; link.href = href; document.head.append(link);
    }
    const script = document.createElement('script'); script.type = 'module'; script.src = release.js; document.head.append(script);
    // Temporary diagnostic query strings never become the public sharing address.
    if (location.search && window === window.top) {
      const view = new URLSearchParams(location.search).get('view');
      history.replaceState(null, '', location.pathname + (view === 'evaluate100' ? '?view=evaluate100' : '') + location.hash);
    }
  } catch (error) {
    document.getElementById('root').textContent = 'Unable to load MeCo. Please refresh. / 加载失败，请刷新页面。';
  }
})();
</script></body></html>
